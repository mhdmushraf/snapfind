    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://snapfind.in/#org",
          "name": "Snapfind",
          "url": "https://snapfind.in/",
          "logo": "https://snapfind.in/logo-512.png",
          "email": "hello@snapfind.in",
          "address": { "@type": "PostalAddress", "addressRegion": "Kerala", "addressCountry": "IN" },

        },
        {
          "@type": "SoftwareApplication",
          "name": "Snapfind",
          "applicationCategory": "PhotographyApplication",
          "operatingSystem": "Web, iOS, Android",
          "url": "https://snapfind.in/",
          "description": "AI face-recognition photo delivery platform for wedding and event photographers in India. Guests scan a QR code, take a selfie, and instantly receive only their photos.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR",
            "description": "Free trial with 5,000 photo credits"
          },
          "publisher": { "@id": "https://snapfind.in/#org" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Snapfind find a guest's photos?",
              "acceptedAnswer": { "@type": "Answer", "text": "The guest scans the event QR code and takes a selfie. Snapfind compares that selfie against every face in the event gallery using open-source face recognition and returns only the photos that guest appears in." }
            },
            {
              "@type": "Question",
              "name": "Is guest face data stored?",
              "acceptedAnswer": { "@type": "Answer", "text": "Selfies are deleted within 24 hours. Face data for an event is deleted when the event expires. Every guest gives explicit consent before their selfie is taken, in line with India's DPDP Act." }
            },
            {
              "@type": "Question",
              "name": "Can guests get their photos on WhatsApp?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Guests can optionally enter their phone number and receive a link to their photos on WhatsApp." }
            },
            {
              "@type": "Question",
              "name": "How much does Snapfind cost?",
              "acceptedAnswer": { "@type": "Answer", "text": "Photographers start free with 5,000 photo credits. Paid plans are priced per photo, with no monthly fee for occasional users." }
            }
          ]
        }
      ]
    }
